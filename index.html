<!doctype html>
<html lang="vi">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Màu thanh địa chỉ trên điện thoại: script dưới và themePrefs.ts đổi theo chế độ sáng/tối -->
    <meta name="theme-color" content="#0e0d0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <!-- Áp chế độ sáng/tối và màu nhấn đã lưu trước khi trang hiện (tránh nháy màu). Khoá và bảng
         biến được ghi bởi src/theme/themePrefs.ts. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem('sw_theme_mode');
          if (mode !== 'light' && mode !== 'dark') mode = 'dark';
          root.classList.toggle('dark', mode === 'dark');
          root.style.colorScheme = mode;
          var tc = document.querySelector('meta[name="theme-color"]');
          if (tc) tc.setAttribute('content', mode === 'dark' ? '#0e0d0c' : '#fafaf9');
          var vars = JSON.parse(localStorage.getItem('sw_accent_vars') || 'null');
          if (vars) for (var k in vars) if (k.indexOf('--sw-accent') === 0) root.style.setProperty(k, vars[k]);
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #fafaf9; }
      html.dark { background: #0e0d0c; }
    </style>
    <title>Smart Wardrobe — Studio Thử Đồ 3D & Tủ Đồ Thông Minh</title>
    <meta name="description" content="Smart Wardrobe: Studio thử đồ 3D và tủ đồ thông minh theo chiều cao, cân nặng, số đo cơ thể với khả năng điều khiển từng khớp xương và chất liệu vải PBR chân thực." />
    <meta property="og:title" content="Smart Wardrobe — Studio Thử Đồ 3D & Tủ Đồ Thông Minh" />
    <meta property="og:description" content="Smart Wardrobe: Studio thử đồ 3D và tủ đồ thông minh theo chiều cao, cân nặng, số đo cơ thể với khả năng điều khiển từng khớp xương và chất liệu vải PBR chân thực." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
